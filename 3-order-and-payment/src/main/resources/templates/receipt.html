<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receipt | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <nav class="header-nav">
            <a th:href="@{/products}">Browse</a>
            <a th:href="@{/orders}">My Orders</a>
            <a th:if="${role != null and role != 'CUSTOMER'}" th:href="@{/admin/dashboard}">Dashboard</a>
        </nav>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-title">Payment Successful</div>
            <div class="alert alert-success">Your payment was processed successfully.</div>

            <table style="margin-bottom:1.5rem;">
                <tr><td class="muted" style="border-bottom:1px solid var(--border);">Order</td><td style="border-bottom:1px solid var(--border);" th:text="'#' + ${order.orderId}">#1</td></tr>
                <tr><td class="muted" style="border-bottom:1px solid var(--border);">Amount</td><td class="primary" style="border-bottom:1px solid var(--border);" th:text="'$' + ${payment.amount}">$0.00</td></tr>
                <tr><td class="muted" style="border-bottom:1px solid var(--border);">Method</td><td style="border-bottom:1px solid var(--border);" th:text="${payment.paymentMethod}">CARD</td></tr>
                <tr><td class="muted" style="border-bottom:1px solid var(--border);">Transaction Ref</td><td style="border-bottom:1px solid var(--border); font-size:0.78rem;" th:text="${payment.transactionRef}">TXN-XXXX</td></tr>
                <tr><td class="muted">Status</td><td><span class="pill" th:classappend="'pill-' + ${payment.paymentStatus}" th:text="${payment.paymentStatus}">SUCCESS</span></td></tr>
            </table>

            <a class="btn btn-primary" th:href="@{/orders/{id}(id=${order.orderId})}" style="width:100%; justify-content:center;">View Order Status</a>
        </div>
    </div>
</div>

</body>
</html>
