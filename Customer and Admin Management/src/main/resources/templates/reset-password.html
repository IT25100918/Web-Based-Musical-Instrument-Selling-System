<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Ceylon Music House</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-name">Ceylon Music House</div>
                <div class="logo-sub">Fine Instruments &amp; Sound</div>
            </div>
            <div class="auth-title">Choose a new password</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="form-group">
                    <label class="form-label">New Password <span>(min 6 characters)</span></label>
                    <input type="password" name="newPassword" maxlength="72" class="form-input" minlength="6" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Update Password</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
