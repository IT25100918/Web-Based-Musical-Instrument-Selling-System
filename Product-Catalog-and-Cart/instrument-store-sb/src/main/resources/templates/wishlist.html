<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Wishlist | Ceylon Music House</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <nav class="header-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Shop</a>
            <a th:href="@{/orders}">Orders</a>
            <a th:href="@{/wishlist}" class="active">Wishlist</a>
            <a th:href="@{/complaints}">Support</a>
            <a class="cart-badge" th:href="@{/cart}">Cart</a>
        </nav>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <a th:if="${role != null and role != 'CUSTOMER'}" th:href="@{/admin/dashboard}" class="btn btn-outline btn-sm">Dashboard</a>
            <a th:href="@{/profile}" class="btn btn-outline btn-sm">My Profile</a>
            <form th:action="@{/logout}" method="post" style="display:inline;margin:0;"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</header>

<div class="main">
    <div class="container">
        <div class="page-header">
            <div><div class="page-title">My Wishlist</div></div>
        </div>

        <div class="panel" th:if="${#lists.isEmpty(items)}">
            <div class="panel-body" style="text-align:center;">
                <p>Nothing saved yet. <a th:href="@{/products}" style="color:var(--gold);">Browse instruments</a>.</p>
            </div>
        </div>

        <div class="product-grid" th:unless="${#lists.isEmpty(items)}">
            <div class="product-card" th:each="item : ${items}" style="cursor:default;">
                <div class="product-card-img">
                    <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}" th:src="@{${item.imageUrl}}" th:alt="${item.productName}">
                    <span th:unless="${item.imageUrl != null and !item.imageUrl.isEmpty()}" class="emoji">&#127929;</span>
                </div>
                <div class="product-card-body">
                    <div class="product-card-name" th:text="${item.productName}">Product</div>
                    <div class="product-card-footer" style="margin-bottom:0.9rem;">
                        <div class="product-price"><span class="amount" th:text="'Rs. ' + ${#numbers.formatDecimal(item.price,1,'COMMA',2,'POINT')}">Rs. 0.00</span></div>
                    </div>
                    <div style="display:flex; gap:0.5rem;">
                        <form th:action="@{/cart}" method="post">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-primary btn-sm" th:disabled="${item.stockQuantity == 0}">Add to Cart</button>
                        </form>
                        <form th:action="@{/wishlist/remove}" method="post">
                            <input type="hidden" name="wishlistId" th:value="${item.wishlistId}">
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-links">
        <a th:href="@{/terms}">Terms &amp; Conditions</a>
        <a th:href="@{/privacy}">Privacy Policy</a>
        <a th:href="@{/contact}">Contact &amp; Support</a>
    </div>
    <div class="copyright">&copy; 2026 Ceylon Music House — The Home of Music. All Rights Reserved.</div>
</footer>

</body>
</html>
