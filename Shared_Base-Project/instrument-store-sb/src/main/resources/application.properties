# Passwords and other secrets are NOT kept in this file. They live in secrets.properties (next to pom.xml,
# listed in .gitignore, never committed). Copy secrets.properties.example to secrets.properties and fill it in.
# Environment variables (e.g. SPRING_DATASOURCE_PASSWORD) also work and override the file.
spring.config.import=optional:file:./secrets.properties

# Server port - the app will run at http://localhost:8080
server.port=8080

# SQL Server connection - update host/port/instance to match your machine if different
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=instrument_store;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Thymeleaf - disable caching so template edits show up without restarting (dev convenience)
spring.thymeleaf.cache=false

# File upload limits (used by Product Catalog image upload, including multi-image galleries)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Email notifications (Delivery/Order status updates).
# OFF until email is set up: nothing is sent and no "Authentication failed" errors appear.
# To turn on: put a real Gmail address + app password in secrets.properties, then set this to true.
app.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Without these, an unreachable SMTP server makes register/forgot-password/contact hang forever
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL used in emailed verification / password-reset links. Set this to your real public URL.
# (If left blank the app falls back to the request's Host header, which can be spoofed.)
app.base-url=http://localhost:8080

# Session cookie hardening (also mitigates cross-site POST forgery)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

app.contact-email=support@ceylonmusichouse.com