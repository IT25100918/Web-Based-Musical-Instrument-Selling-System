<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#E6F2EE"/>
  <g stroke="#0F4048" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- guitar body: two stacked ellipses for the figure-eight shape -->
    <ellipse cx="220" cy="240" rx="58" ry="52" fill="#FFE9E0"/>
    <ellipse cx="220" cy="160" rx="42" ry="38" fill="#FFE9E0"/>
    <circle cx="220" cy="200" r="18" fill="#0F4048" opacity="0.18" stroke="none"/>
    <!-- neck -->
    <rect x="205" y="55" width="18" height="115" rx="4" fill="#FFE9E0"/>
    <!-- headstock -->
    <rect x="192" y="30" width="44" height="30" rx="8" fill="#FFE9E0"/>
    <circle cx="200" cy="40" r="3.5" fill="#0F4048" stroke="none"/>
    <circle cx="200" cy="52" r="3.5" fill="#0F4048" stroke="none"/>
    <circle cx="228" cy="40" r="3.5" fill="#0F4048" stroke="none"/>
    <circle cx="228" cy="52" r="3.5" fill="#0F4048" stroke="none"/>
    <!-- strings -->
    <line x1="212" y1="60" x2="212" y2="285" stroke-width="1.5" opacity="0.5"/>
    <line x1="220" y1="60" x2="220" y2="290" stroke-width="1.5" opacity="0.5"/>
    <line x1="228" y1="60" x2="228" y2="285" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
