<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#E6F2EE"/>
  <g stroke="#0F4048" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="150" width="280" height="110" rx="10" fill="#FFE9E0"/>
    <!-- white key dividers -->
    <line x1="100" y1="150" x2="100" y2="260" stroke-width="3"/>
    <line x1="140" y1="150" x2="140" y2="260" stroke-width="3"/>
    <line x1="180" y1="150" x2="180" y2="260" stroke-width="3"/>
    <line x1="220" y1="150" x2="220" y2="260" stroke-width="3"/>
    <line x1="260" y1="150" x2="260" y2="260" stroke-width="3"/>
    <line x1="300" y1="150" x2="300" y2="260" stroke-width="3"/>
    <!-- black keys -->
    <rect x="88" y="150" width="20" height="60" rx="3" fill="#0F4048" stroke="none"/>
    <rect x="128" y="150" width="20" height="60" rx="3" fill="#0F4048" stroke="none"/>
    <rect x="208" y="150" width="20" height="60" rx="3" fill="#0F4048" stroke="none"/>
    <rect x="248" y="150" width="20" height="60" rx="3" fill="#0F4048" stroke="none"/>
    <rect x="288" y="150" width="20" height="60" rx="3" fill="#0F4048" stroke="none"/>
  </g>
</svg>
