<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Report | Admin</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Admin Console</span>
        </a>
        <nav class="header-nav">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/inventory}">Inventory</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/suppliers}">Suppliers</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/purchase-orders}">P.O.s</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER'}" th:href="@{/admin/reports/sales}">Sales Report</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/reports/inventory}" class="active">Inventory Report</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER'}" th:href="@{/admin/reports/financial}">Financial Statement</a>
        </nav>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <a th:href="@{/products}" class="btn btn-outline btn-sm">View Store</a>
            <form th:action="@{/logout}" method="post" style="display:inline;margin:0;"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</header>

<div class="main">
    <div class="container">
        <div class="page-header">
            <div>
                <div class="page-title">Inventory Report</div>
                <div class="page-sub">Current stock, units sold, and units received per product</div>
            </div>
        </div>

        <div class="panel">
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                    <tr><th>Product</th><th>Current Stock</th><th>Units Sold (all time)</th><th>Units Received (all time)</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${inventoryRows}">
                        <td th:text="${row.name}">Product</td>
                        <td th:text="${row.stock_quantity}">0</td>
                        <td th:text="${row.units_sold}">0</td>
                        <td th:text="${row.units_received}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
