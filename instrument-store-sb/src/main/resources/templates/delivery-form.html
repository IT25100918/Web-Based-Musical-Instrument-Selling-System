<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Delivery | Admin</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Admin Console</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/admin/deliveries}">&larr; Back to list</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="container" style="max-width: 560px; padding-top: 2rem;">
        <div class="form-card">
            <div class="page-title" style="font-size:1.5rem; margin-bottom:1.5rem;">Assign Delivery</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <p th:if="${#lists.isEmpty(orders)}" style="color: var(--muted);">
                No orders are currently awaiting delivery assignment.
            </p>

            <form th:unless="${#lists.isEmpty(orders)}" th:action="@{/admin/deliveries}" method="post">
                <div class="form-group">
                    <label class="form-label">Order</label>
                    <select name="orderId" class="form-input" required onchange="document.getElementById('addr').value = this.selectedOptions[0].dataset.address || ''">
                        <option th:each="o : ${orders}"
                                th:value="${o.order_id}"
                                th:attr="data-address=${o.user_address}"
                                th:text="'#' + ${o.order_id} + ' (' + ${o.order_status} + ')'">Order</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Delivery Address</label>
                    <input type="text" name="deliveryAddress" maxlength="255" id="addr" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Scheduled Date</label>
                    <input type="date" name="scheduledDate" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Delivery Person</label>
                    <input type="text" name="deliveryPerson" maxlength="100" class="form-input" placeholder="e.g. Nimal Perera">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Assign Delivery</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var select = document.querySelector('select[name="orderId"]');
        var addrField = document.getElementById('addr');
        if (select && select.selectedOptions.length > 0) {
            addrField.value = select.selectedOptions[0].dataset.address || '';
        }
    });
</script>
</body>
</html>
