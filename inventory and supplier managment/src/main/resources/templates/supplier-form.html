<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add / Edit Supplier | Admin</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Admin Console</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/admin/suppliers}">&larr; Back to list</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="container" style="max-width: 560px; padding-top: 2rem;">
        <div class="form-card">
            <div class="page-title" style="font-size:1.5rem; margin-bottom:1.5rem;" th:text="${supplier.supplierId != 0} ? 'Edit Supplier' : 'Add Supplier'">Add Supplier</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/admin/suppliers}" method="post">
                <input type="hidden" name="supplierId" th:value="${supplier.supplierId != 0} ? ${supplier.supplierId} : ''">

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" maxlength="150" class="form-input" th:value="${supplier.name}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact Email</label>
                    <input type="email" name="contactEmail" maxlength="100" class="form-input" th:value="${supplier.contactEmail}">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" maxlength="20" pattern="\+?[0-9 \(\)\-]{7,20}" title="Digits, spaces, + ( ) - only, e.g. +94 77 123 4567" class="form-input" th:value="${supplier.phone}">
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" maxlength="255" class="form-input" th:value="${supplier.address}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
