<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/profile}">&larr; Back to Profile</a>
            <a th:if="${role != null and role != 'CUSTOMER'}" th:href="@{/admin/dashboard}">Dashboard</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-title">Change Password</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/profile/password}" method="post">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="currentPassword" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password <span>(min 6 characters)</span></label>
                    <input type="password" name="newPassword" class="form-input" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Update Password</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
