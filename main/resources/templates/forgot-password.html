<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-name">Ceylon Music House</div>
                <div class="logo-sub">Fine Instruments &amp; Sound</div>
            </div>
            <div class="auth-title">Reset your password</div>
            <div class="auth-sub">Enter your account email and we'll send you a reset link</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="your@email.com" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Send Reset Link</button>
            </form>

            <p class="auth-footer"><a th:href="@{/login}">&larr; Back to Sign In</a></p>
        </div>
    </div>
</div>

</body>
</html>
