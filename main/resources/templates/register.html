<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card auth-card-wide">
            <div class="auth-logo">
                <div class="logo-name">Ceylon Music House</div>
                <div class="logo-sub">Fine Instruments &amp; Sound</div>
            </div>
            <div class="auth-title">Create your account</div>
            <div class="auth-sub">Join us for gear, gigs, and good sound</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Password <span>(min 6 characters)</span></label>
                        <input type="password" name="password" class="form-input" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-input">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Register</button>
            </form>

            <p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</div>

</body>
</html>
