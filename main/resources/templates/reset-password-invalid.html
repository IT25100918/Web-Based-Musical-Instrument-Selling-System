<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Link Expired | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-name">Ceylon Music House</div>
                <div class="logo-sub">Fine Instruments &amp; Sound</div>
            </div>
            <div class="auth-title">Link expired</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <a th:href="@{/forgot-password}" class="btn btn-primary" style="width:100%; justify-content:center;">Request a new link</a>
            <p class="auth-footer"><a th:href="@{/login}">&larr; Back to Sign In</a></p>
        </div>
    </div>
</div>

</body>
</html>
