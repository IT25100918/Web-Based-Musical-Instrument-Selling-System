<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories | Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Admin Console</span>
        </a>
        <nav class="header-nav">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:if="${role == 'ADMIN' or role == 'CATALOG_MANAGER'}" th:href="@{/admin/products}">Products</a>
            <a th:if="${role == 'ADMIN' or role == 'CATALOG_MANAGER'}" th:href="@{/admin/categories}" class="active">Categories</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER' or role == 'CUSTOMER_RELATIONS_MANAGER'}" th:href="@{/admin/orders}">Orders</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER'}" th:href="@{/admin/payments}">Payments</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/inventory}">Inventory</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/suppliers}">Suppliers</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/purchase-orders}">P.O.s</a>
            <a th:if="${role == 'ADMIN' or role == 'DELIVERY_MANAGER'}" th:href="@{/admin/deliveries}">Deliveries</a>
                    <a th:if="${role == 'ADMIN' or role == 'CUSTOMER_RELATIONS_MANAGER'}" th:href="@{/admin/customers}">Customers</a>
            <a th:if="${role == 'ADMIN' or role == 'CUSTOMER_RELATIONS_MANAGER'}" th:href="@{/admin/complaints}">Complaints</a>
            <a th:if="${role == 'ADMIN' or role == 'CUSTOMER_RELATIONS_MANAGER'}" th:href="@{/admin/reviews}">Reviews</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER'}" th:href="@{/admin/reports/sales}">Sales Report</a>
            <a th:if="${role == 'ADMIN' or role == 'INVENTORY_MANAGER'}" th:href="@{/admin/reports/inventory}">Inventory Report</a>
            <a th:if="${role == 'ADMIN' or role == 'ORDER_PAYMENT_MANAGER'}" th:href="@{/admin/reports/financial}">Financial Report</a>
        </nav>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <a th:href="@{/}" class="btn btn-outline btn-sm">View Store</a>
            <form th:action="@{/logout}" method="post" style="display:inline;margin:0;"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</header>

<div class="main">
    <div class="container">
        <div class="page-header">
            <div><div class="page-title">Categories</div></div>
            <a class="btn btn-primary" th:href="@{/admin/categories/new}">+ Add Category</a>
        </div>

        <div class="alert alert-error" th:if="${error}" th:text="${error}" style="margin-bottom:1rem;"></div>

        <div class="panel">
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.name}">Name</td>
                        <td class="muted" th:text="${c.description}">Description</td>
                        <td>
                            <a th:href="@{/admin/categories/edit/{id}(id=${c.categoryId})}" class="btn btn-outline btn-sm">Edit</a>
                            <form th:action="@{/admin/categories/delete/{id}(id=${c.categoryId})}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Delete this category? It can only be deleted if no products belong to it.');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
