<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add / Edit Category | Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Admin Console</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/admin/categories}">&larr; Back to list</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="container" style="max-width: 560px; padding-top: 2rem;">
        <div class="form-card">
            <div class="page-title" style="font-size:1.5rem; margin-bottom:1.5rem;" th:text="${category.categoryId != 0} ? 'Edit Category' : 'Add Category'">Add Category</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/admin/categories}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="categoryId" th:value="${category.categoryId != 0} ? ${category.categoryId} : ''">
                <input type="hidden" name="existingImageUrl" th:value="${category.imageUrl}">

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-input" th:value="${category.name}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" rows="3" class="form-input" th:text="${category.description}"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Category Image</label>
                    <img th:if="${category.imageUrl != null and !category.imageUrl.isEmpty()}"
                         th:src="@{${category.imageUrl}}" style="max-width: 100px; border-radius: 0.5rem; margin-bottom: 0.6rem; display: block; border:1px solid var(--border);">
                    <input type="file" name="imageFile" accept="image/*" class="form-input">
                    <p style="font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem;">Leave blank to keep the current image. If no image is uploaded, the storefront shows a music-note icon instead.</p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
