<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Ceylon Music House</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-name">Ceylon Music House</span>
            <span class="brand-sub">Fine Instruments &amp; Sound</span>
        </a>
        <div class="header-nav">
            <a th:href="@{/register}">Create an account</a>
        </div>
    </div>
</header>

<div class="main">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-name">Ceylon Music House</div>
                <div class="logo-sub">Fine Instruments &amp; Sound</div>
            </div>
            <div class="auth-title">Welcome back</div>
            <div class="auth-sub">Sign in to continue shopping</div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="your@email.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>Password</span>
                        <a th:href="@{/forgot-password}" style="text-transform:none; font-weight:400; color:var(--gold); letter-spacing:normal;">Forgot password?</a>
                    </label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
            </form>

            <p class="auth-footer">No account yet? <a th:href="@{/register}">Register here</a></p>
        </div>
    </div>
</div>

</body>
</html>
